name: QA Expense and Payment Diagnostics (one-off)
on:
  push:
    branches: [fix/qa-expense-timeouts-cost-recalc-20261115]
permissions:
  contents: read
concurrency:
  group: qtas-qa-diagnostic
  cancel-in-progress: false
jobs:
  run-targeted-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Set up isolated QA
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON_TEST: ${{ secrets.CLASP_JSON_TEST }}
          QTAS_TEST_CONFIG_JSON: ${{ secrets.QTAS_TEST_CONFIG_JSON }}
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON_TEST }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON_TEST"
          test -n "$QTAS_TEST_CONFIG_JSON"
          test -n "$GOOGLE_AUTHORIZED_USER_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON_TEST" > .clasp.test.json
          printf '%s' "$QTAS_TEST_CONFIG_JSON" > tests/qtas.test.config.json
      - name: Deploy to QA, not production
        run: npm run deploy:test:push
      - name: QA probe
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON_TEST }}
        run: npm run test:qtas:probe:qa
      - name: Run only the two previously failed E2E scenarios
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON_TEST }}
        run: node tests/run-qtas-tests.mjs --config tests/qtas.test.config.json --scenario compra_gasto_no_impacta_costo --scenario medio_pago_nuevo_y_rechazo_al_desactivar --fail-fast
      - name: Save error report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: qtas-qa-expense-failure-${{ github.run_id }}
          path: tests/.artifacts/last-failure.json
          if-no-files-found: ignore
          retention-days: 7
