name: QA Distribution Diagnostic Temporary
on:
  push:
    branches:
      - fix/qa-smoke-distribution-timeout-20261115
permissions:
  contents: read
jobs:
  targeted-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Configure QA credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON_TEST: ${{ secrets.CLASP_JSON_TEST }}
          QTAS_TEST_CONFIG_JSON: ${{ secrets.QTAS_TEST_CONFIG_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON_TEST"
          test -n "$QTAS_TEST_CONFIG_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON_TEST" > .clasp.test.json
          printf '%s' "$QTAS_TEST_CONFIG_JSON" > tests/qtas.test.config.json
      - name: Push QA code
        run: npm run deploy:test:push
      - name: Probe
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON_TEST }}
        run: npm run test:qtas:probe:qa
      - name: Regression distribution rule
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON_TEST }}
        run: node tests/run-qtas-tests.mjs --config tests/qtas.test.config.json --scenario regla_distribucion_nueva_aplicada --fail-fast
      - name: Upload failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-distribution-failure-${{ github.run_id }}
          path: tests/.artifacts/last-failure.json
          if-no-files-found: ignore
          retention-days: 7
