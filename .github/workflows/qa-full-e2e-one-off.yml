name: QA Full E2E - One-off

on:
  push:
    branches:
      - ci/run-full-e2e-qa-20261115

permissions:
  contents: read

concurrency:
  group: qtas-qa-full-e2e
  cancel-in-progress: false

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure QA secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON_TEST: ${{ secrets.CLASP_JSON_TEST }}
          QTAS_TEST_CONFIG_JSON: ${{ secrets.QTAS_TEST_CONFIG_JSON }}
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON_TEST }}
        run: |
          test -n "$CLASPRC_JSON" || { echo "::error::Missing CLASPRC_JSON"; exit 1; }
          test -n "$CLASP_JSON_TEST" || { echo "::error::Missing CLASP_JSON_TEST"; exit 1; }
          test -n "$QTAS_TEST_CONFIG_JSON" || { echo "::error::Missing QTAS_TEST_CONFIG_JSON"; exit 1; }
          test -n "$GOOGLE_AUTHORIZED_USER_JSON" || { echo "::error::Missing GOOGLE_AUTHORIZED_USER_JSON_TEST"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON_TEST" > .clasp.test.json
          printf '%s' "$QTAS_TEST_CONFIG_JSON" > tests/qtas.test.config.json
      - name: Deploy matching main revision to QA
        run: npm run deploy:test:push
      - name: Verify Apps Script API connection (QA)
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON_TEST }}
        run: npm run test:qtas:probe:qa
      - name: Run all QA E2E scenarios
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON_TEST }}
        run: npm run test:qtas:full:qa
      - name: Save failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: qtas-full-e2e-failure-${{ github.run_id }}
          path: tests/.artifacts/last-failure.json
          if-no-files-found: ignore
          retention-days: 14
