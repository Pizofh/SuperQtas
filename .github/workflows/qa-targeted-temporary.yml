name: QA Targeted Temporary Diagnostic
on:
  push:
    branches:
      - fix/qa-targeted-fast-fail-diagnostics-20261115

permissions:
  contents: read

concurrency:
  group: qtas-temporary-diagnostic
  cancel-in-progress: false

jobs:
  targeted-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure isolated QA credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON_TEST: ${{ secrets.CLASP_JSON_TEST }}
          QTAS_TEST_CONFIG_JSON: ${{ secrets.QTAS_TEST_CONFIG_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON_TEST"
          test -n "$QTAS_TEST_CONFIG_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON_TEST" > .clasp.test.json
          printf '%s' "$QTAS_TEST_CONFIG_JSON" > tests/qtas.test.config.json
      - name: Push code to QA Apps Script
        run: npm run deploy:test:push
      - name: Verify QA connectivity
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON_TEST }}
        run: npm run test:qtas:probe:qa
      - name: Run only failing sale-deletion regression
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON_TEST }}
        run: node tests/run-qtas-tests.mjs --config tests/qtas.test.config.json --scenario venta_eliminacion_reciente_reusa_id --fail-fast
      - name: Upload failure details
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: qtas-targeted-failure-${{ github.run_id }}
          path: tests/.artifacts/last-failure.json
          if-no-files-found: ignore
          retention-days: 7
